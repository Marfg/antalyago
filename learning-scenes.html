<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Antalya GO — Öğrenme Sahneleri</title>
<link rel="stylesheet" href="styles/learning-scenes.css" />
</head>
<body>
<!-- v0.9 — Board ve anlatım şeridi TEK bir dikey eksende (#ls-stage):
     board üstte, anlatım şeridi hemen altında, İKİSİ DE aynı genişlik
     bütçesini paylaşır. Ayrı bir yan/alt "panel" YOK; şerit canvas'ın
     üzerine position:absolute ile de BİNDİRİLMİYOR — akışın normal bir
     parçası (bkz. styles/learning-scenes.css). -->
<div id="ls-layout">
  <div id="ls-stage">
    <div id="ls-board-region">
      <canvas id="ls-canvas" aria-hidden="true"></canvas>
    </div>
    <div id="ls-narration">
      <!-- Sahne modülleri kendi UI'larını buraya kurar (context.container) -->
      <div id="ls-scene-host" aria-live="polite"></div>
      <!-- v0.10 — "Konular" paneli: #ls-scene-host'un YERİNİ GEÇİCİ olarak
           alır (aynı sabit yükseklikte) — board üzerine açılan kalıcı bir
           panel DEĞİL (bkz. görev talimatı Bölüm A). -->
      <div id="ls-topics-panel" role="region" aria-label="Konular" hidden>
        <div class="ls-topics-header">Konular</div>
        <ul class="ls-topics-list" id="ls-topics-list"></ul>
      </div>
    </div>
  </div>
</div>

<div id="ls-topbar">
  <a href="index.html">← Ana</a>
  <button type="button" class="ls-topbar-btn" id="ls-topics-open">Konular</button>
</div>

<div id="ls-error" role="alert">
  <h2 id="ls-error-title">Sahne yüklenemedi</h2>
  <p id="ls-error-text"></p>
  <button type="button" class="ls-strip-btn" id="ls-error-reload">Yeniden yükle</button>
</div>

<script type="module">
import { createSceneRuntime } from './core/sceneRuntime.js?v=2026-08-25.1';
import { createSceneRegistry } from './scenes/sceneRegistry.js?v=2026-08-25.1';
import { scene01BoardIntro } from './scenes/scene01BoardIntro.js?v=2026-08-25.1';
import { scene02TurnsAndIntersections } from './scenes/scene02TurnsAndIntersections.js?v=2026-08-25.1';
import { scene03LibertiesByPosition } from './scenes/scene03LibertiesByPosition.js?v=2026-08-25.1';
import { scene04GroupLiberties } from './scenes/scene04GroupLiberties.js?v=2026-08-25.1';
import { scene05LibertyAssessment } from './scenes/scene05LibertyAssessment.js?v=2026-08-25.1';
import { scene06CaptureBasics } from './scenes/scene06CaptureBasics.js?v=2026-08-25.1';
import { createSceneBoardAdapter } from './adapters/sceneBoardAdapter.js?v=2026-08-25.1';
import { sceneProgressAdapter } from './adapters/sceneProgressAdapter.js?v=2026-08-25.1';
import { EventLog } from './core/eventLog.js?v=2026-08-25.1';
import { transitionSceneSwap } from './scenes/sceneTransition.js?v=2026-08-25.1';
import { SCENE_RELEASE } from './core/releaseVersion.js?v=2026-08-25.1';

/* ── Sürüm/cache bekçisi ──────────────────────────────────────────────
   GitHub Pages önündeki CDN, .js dosyalarına saatlerce (bkz. görev
   talimatı) önbellekleme izni veriyor. Asıl çözüm: her release'in
   ÖNCEDEN HİÇ görülmemiş versioned import URL'leri kullanması (bkz.
   yukarıdaki '?v=...' damgaları, scripts/stamp-scene-release.mjs) — o
   URL'ler için CDN/tarayıcı cache'i hiçbir zaman isabet veremez.
   KRİTİK DÜZELTME (bkz. görev talimatı): SCENE_RELEASE'in kendisi de
   artık versioned import ediliyor ('?v=...' — yukarıda). Önceki sürümde
   BARE (versiyonsuz) import ediliyordu; bu, bekçinin "o an gerçekte ne
   çalıştığını yansıtır" iddiasını GEÇERSİZ KILIYORDU — bare URL kendisi
   de saatlerce eski cache'den gelebilirdi, bu da çözmeye çalıştığı
   sorunu yeniden üretiyordu. Artık SCENE_RELEASE, mevcut HTML'in KENDİ
   import metnine gömülü query string'i üzerinden gelir — bu yüzden HER
   ZAMAN "bu belirli HTML+JS paketinin GERÇEKTEN hangi release olduğunu"
   deterministik yansıtır (bkz. tests/sceneRelease.test.js).
   Bu bekçi EKSTRA bir katmandır: sayfanın kendisi (HTML) hâlâ kısa ömürlü
   bir önbellekten (max-age=600) gelebileceği için, SCENE_RELEASE'i her
   zaman timestamp'le taze çekilen scene-release.json ile karşılaştırır.
   Uyuşmazlıkta '?release=<hedef>' query'sine TEK bir güvenli yönlendirme
   yapar; localStorage'a HİÇ dokunmaz. Guard artık kalıcı bir "bir kez
   denedim" boolean'ı DEĞİL — (yüklü release → hedef release) ÇİFTİNE
   bağlıdır: eşleşen hedef başarıyla yüklenince guard TEMİZLENİR (bkz.
   görev talimatı "guard tuple"). Aynı geçiş İKİNCİ kez de mismatch
   üretirse (patolojik CDN durumu) sessizce döngüye girmek yerine sade,
   teknik olmayan bir "yeni sürüm hazırlanıyor" arayüzü gösterilir
   (mevcut #ls-error elemanı yeniden kullanılır — localStorage'a
   dokunmaz). */
const RELOAD_GUARD_KEY = 'go_scene_reload_guard_learning_v1';
const MANIFEST_TIMEOUT_MS = 4000;

async function fetchManifestRelease() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), MANIFEST_TIMEOUT_MS);
  try {
    const res = await fetch(`./scene-release.json?t=${Date.now()}`, { cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) { console.warn('[scene-release] manifest HTTP', res.status, '— mevcut versioned graph ile devam'); return null; }
    const manifest = await res.json();
    return manifest?.release ?? null;
  } catch (e) {
    console.warn('[scene-release] manifest fetch başarısız/timeout — mevcut versioned graph ile devam:', e?.message || e);
    return null;
  } finally {
    clearTimeout(timer);
  }
}

function clearReloadGuard() {
  try { sessionStorage.removeItem(RELOAD_GUARD_KEY); } catch {}
}

/** @returns {Promise<'boot'|'stale-ui'|'redirecting'>} */
async function checkSceneRelease() {
  const targetRelease = await fetchManifestRelease();
  if (targetRelease == null) return 'boot'; // manifest okunamadı/timeout — kontrollü bozulma

  if (targetRelease === SCENE_RELEASE) {
    clearReloadGuard(); // önceki bir mismatch'ten kalma guard varsa temizle — sonraki geçiş TAZE denenebilsin
    return 'boot';
  }

  const transition = `${SCENE_RELEASE}=>${targetRelease}`;
  let guardedTransition = null;
  try { guardedTransition = sessionStorage.getItem(RELOAD_GUARD_KEY); } catch {}
  if (guardedTransition === transition) {
    // AYNI geçiş zaten bir kez denendi ve HÂLÂ aynı mismatch'e düşüldü
    // (bkz. görev talimatı Senaryo F) — sessizce döngüye GİRME, kullanıcıya
    // sade bir "yeni sürüm hazırlanıyor" arayüzü göster.
    console.warn('[scene-release] mismatch ikinci kez tekrarlandı (' + transition + ') — otomatik yönlendirme DURDURULDU');
    return 'stale-ui';
  }
  try { sessionStorage.setItem(RELOAD_GUARD_KEY, transition); } catch {}
  const url = new URL(location.href);
  url.searchParams.set('release', targetRelease);
  location.replace(url.toString());
  return 'redirecting'; // navigasyon zaten başladı — boot() ÇAĞRILMAMALI
}

function showStaleReleaseUI() {
  const titleEl = document.getElementById('ls-error-title');
  if (titleEl) titleEl.textContent = 'Yeni sürüm hazırlanıyor';
  document.getElementById('ls-error-text').textContent = 'Öğrenme ekranının yeni sürümü hazırlanıyor. Sayfayı yeniden yükle.';
  document.getElementById('ls-error').classList.add('show');
}

/* ── Event log — ogren-3d.html/teacher-studio.html İLE AYNI anahtar ────
   Sahne event'leri Teacher Studio'nun MEVCUT Event Log panelinde
   görünsün diye paylaşılan 'go_teacher_event_log_v1' anahtarına yazılır.
   Studio ayrı bir sekmede aynı anahtara yazabileceği için, her ekleme
   ÖNCESİ storage'dan taze okunur (v0.7'de kurulan "resync" deseniyle
   AYNI) — yoksa bu sayfanın bir yazması Studio'nun az önce eklediği bir
   event'i sessizce silebilir. */
const TEACHER_LOG_KEY = 'go_teacher_event_log_v1';
function readAllEvents() {
  try {
    const raw = JSON.parse(localStorage.getItem(TEACHER_LOG_KEY) || '[]');
    return Array.isArray(raw) ? raw : [];
  } catch { return []; }
}
function appendEvent(partial) {
  const log = new EventLog();
  log.restore(readAllEvents());
  log.append(partial);
  try { localStorage.setItem(TEACHER_LOG_KEY, JSON.stringify(log.getAll().slice(-500))); } catch {}
}

const canvas = document.getElementById('ls-canvas');
const isMobile = window.innerWidth <= 640 || ('ontouchstart' in window && window.innerWidth <= 1024);
const boardAdapter = createSceneBoardAdapter(canvas, { isMobile, initialSize: 19 });

const registry = createSceneRegistry([scene01BoardIntro, scene02TurnsAndIntersections, scene03LibertiesByPosition, scene04GroupLiberties, scene05LibertyAssessment, scene06CaptureBasics]);

const searchParams = new URLSearchParams(location.search);

/* Test-only hook: ?exposeBoardAdapter=1 boardAdapter'ın SEÇİLİ, salt-okunur
   bir durum sorgusunu (yalnız getMovePreviewState) window'a bağlar — YALNIZ
   Sahne #3'ün başlangıç taş silueti gibi canvas-only ghost preview
   durumunu gerçek tarayıcı testlerinde DOM/event log'a yansımadan
   doğrulayabilmek için (bkz. görev talimatı). Parametre yoksa hiçbir
   global değişken OLUŞTURULMAZ — üretim davranışı ETKİLENMEZ.
   v0.19 — getHoverPoint eklendi: Sahne #5'in board_tap öğeleri görsel bir
   hover önizlemesi KURMAZ (bkz. scene05LibertyAssessment.js), bu yüzden
   testlerin "hangi ekran ofseti hangi GERÇEK (row,col)'a denk geliyor"
   sorusunu sabit piksel varsayımı OLMADAN yanıtlayabilmesi için adaptörün
   kendi hit-test sonucu ayrıca dışa açıldı (bkz. adapters/
   sceneBoardAdapter.js getHoverPoint notu).
   v2 — getLibertyPoints eklendi: Sahne #5'in doğru cevap SONRASI GERÇEKTEN
   hangi koordinatları turkuaz işaretlediğini (eski hata: hamle-ÖNCESİ küme
   tekrar gösteriliyordu) testlerin event log'a/varsayıma güvenmeden,
   adaptörün kendi çizim durumundan doğrudan okuyabilmesi için (bkz. görev
   talimatı: "yalnız event sayısına güvenme"). */
if (searchParams.get('exposeBoardAdapter') === '1') {
  window.__lsTestBoardAdapter = {
    getMovePreview: () => boardAdapter.getMovePreviewState(),
    getHoverPoint: () => boardAdapter.getHoverPoint(),
    getLibertyPoints: () => boardAdapter.getLibertyPoints(),
  };
}

/* Test-only hook: ?forceMountError=<sceneId> o TEK sahnenin mount()'unu
   kasıtlı olarak fırlatan bir sürümle DEĞİŞTİRİR — YALNIZ Bölüm C'nin
   "mount hatası → #ls-error + Yeniden yükle" kurtarma UI'ını gerçek
   sayfada, hiçbir üretim modülünü değiştirmeden test edebilmek için.
   Parametre yoksa registry.get() DOKUNULMADAN üretim davranışını korur. */
const forceMountErrorSceneId = searchParams.get('forceMountError');
if (forceMountErrorSceneId) {
  const originalGet = registry.get;
  registry.get = (id) => {
    const scene = originalGet(id);
    if (!scene || id !== forceMountErrorSceneId) return scene;
    return { ...scene, mount() { throw new Error('Simulated mount error (test hook)'); } };
  };
}

const sceneHost = document.getElementById('ls-scene-host');
const errorEl = document.getElementById('ls-error');
const topicsPanel = document.getElementById('ls-topics-panel');
const topicsList = document.getElementById('ls-topics-list');
const topicsOpenBtn = document.getElementById('ls-topics-open');

/* Test-only hook: ?whiteMoveDelayMs=N Sahne #2'nin beyaz cevap gecikmesini
   ezer — YALNIZ turn-loop testlerinin gerçek zamanlı 450–700ms beklemeler
   yüzünden yavaşlamaması için (bkz. görev talimatı). Üretim davranışını
   DEĞİŞTİRMEZ: parametre yoksa context.whiteMoveDelayMs verilmez,
   scene02TurnsAndIntersections.js kendi varsayılanını kullanır. */
const whiteMoveDelayParam = searchParams.get('whiteMoveDelayMs');
const whiteMoveDelayOverride = whiteMoveDelayParam != null && Number.isFinite(Number(whiteMoveDelayParam)) ? Number(whiteMoveDelayParam) : null;

const runtime = createSceneRuntime({
  registry,
  progressAdapter: sceneProgressAdapter,
  emitEvent: appendEvent,
  contextExtras: () => ({
    container: sceneHost,
    boardAdapter,
    openTopicsList,
    ...(whiteMoveDelayOverride != null ? { whiteMoveDelayMs: whiteMoveDelayOverride } : {}),
  }),
});

function showErrorState(sceneId, reason) {
  const message = reason === 'UNKNOWN_SCENE'
    ? 'Bu konu şu anda bulunamadı.'
    : 'Bu konu şu anda başlatılamıyor. Sayfayı yeniden yüklemeyi deneyebilirsin.';
  document.getElementById('ls-error-text').textContent = message;
  errorEl.classList.add('show');
}
document.getElementById('ls-error-reload').addEventListener('click', () => {
  // Sade bir sayfa yenilemesi — localStorage'a HİÇ dokunmaz, bu yüzden
  // hem yeni hem eski progress GÜVENLE korunur (bkz. görev talimatı Bölüm C).
  location.reload();
});

/* ── Konular paneli ──────────────────────────────────────────────────
   Board üzerine açılan kalıcı bir panel DEĞİL — #ls-narration'ın İÇİNDE
   #ls-scene-host'un yerini geçici olarak alır (aynı sabit yükseklik
   bütçesi, board bounding box'ı ASLA değişmez). Tamamlanan konular
   seçilince replay modunda başlatılır; henüz açılmamış konular disabled.
   v0.14 — girdi kilidi artık boardAdapter.suspendInteraction()/
   resumeInteraction() ile açık bir anlık-görüntü modeliyle yönetilir
   (bkz. adaptör dosya başı notu) — eski setInputEnabled(bool) tabanlı
   "önce neydi hatırla" yaklaşımı, Sahne #3'ün INTRO'da (henüz hover
   aboneliği kurulmadan) doğrudan kurduğu başlangıç silüetini panel
   açılışında koşulsuz siliyor ve panel kapanışında GERİ GETİRMİYORDU
   (kök neden: setInputEnabled(false) girdi zaten kapalıyken bile
   movePreview'ı koşulsuz temizliyordu). Snapshot'ın hangi SAHNEYE ait
   olduğu da kaydedilir — panel açıkken sahne DEĞİŞMİŞSE (bu akışta
   şu an mümkün değil ama savunma amaçlı) eski snapshot ASLA
   uygulanmaz. */
let topicsOpenerEl = null;
let interactionSnapshot = null;
let interactionSnapshotSceneId = null;
function renderTopicsList() {
  const completed = sceneProgressAdapter.load().completedSceneIds;
  const activeId = runtime.getActiveSceneId();
  const firstIncomplete = registry.list().find(scene => !completed.includes(scene.id));
  topicsList.innerHTML = '';
  registry.list().forEach(scene => {
    const isDone = completed.includes(scene.id);
    const isActive = scene.id === activeId;
    const isLocked = !isDone && !isActive && scene.id !== firstIncomplete?.id;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ls-topic-item';
    btn.disabled = isLocked;
    if (isActive) btn.setAttribute('aria-current', 'true');
    const mark = isDone ? '✓' : isActive ? '●' : '○';
    const markClass = isDone ? 'done' : isActive ? 'active' : '';
    btn.innerHTML = `<span class="ls-topic-mark ${markClass}" aria-hidden="true">${mark}</span><span class="ls-topic-title"></span>`;
    btn.querySelector('.ls-topic-title').textContent = scene.title;
    if (!isLocked) {
      btn.addEventListener('click', () => {
        closeTopicsList();
        // Konular listesinden yapılan seçim de ORTAK crossfade geçişini
        // kullanır (bkz. scenes/sceneTransition.js, scenes/
        // topicEndControls.js'in "Sonraki konu"/"Bu konuyu tekrar et"
        // ile AYNI yardımcı) — tutarlı, kesintisiz bir sahne değişimi.
        transitionSceneSwap(sceneHost, () => {
          if (isDone && !isActive) runtime.start(scene.id, { mode: 'replay' });
          else runtime.start(scene.id);
        });
      });
    }
    li.appendChild(btn);
    topicsList.appendChild(li);
  });
}
function openTopicsList() {
  topicsOpenerEl = document.activeElement;
  // Board input'unu (ve mevcut ghost preview'ı) GEÇİCİ olarak askıya al —
  // panel açıkken pointer hâlâ canvas üzerindeyse hamle/silüet YANLIŞLIKLA
  // tetiklenmemeli (bkz. görev talimatı — "Konular listesi açıldığında"
  // ghost'un kilitlenmesi gereken durumlardan biri). Salt-okunur snapshot,
  // HANGİ sahnenin aktif olduğuyla birlikte saklanır (bkz. yukarıki not).
  interactionSnapshotSceneId = runtime.getActiveSceneId();
  interactionSnapshot = boardAdapter.suspendInteraction();
  renderTopicsList();
  sceneHost.hidden = true;
  topicsPanel.hidden = false;
  document.addEventListener('keydown', onTopicsKeydown);
  const firstEnabled = topicsList.querySelector('.ls-topic-item:not(:disabled)');
  firstEnabled?.focus();
}
function closeTopicsList() {
  topicsPanel.hidden = true;
  sceneHost.hidden = false;
  document.removeEventListener('keydown', onTopicsKeydown);
  // Yalnız panel açıldığından beri AYNI sahne hâlâ aktifse snapshot geri
  // yüklenir — sahne değişmişse (bu akışta panel her zaman runtime.start()
  // ÖNCESİNDE kapatıldığı için şu an oluşamaz, ama açık bir güvenlik
  // sınırıdır) eski snapshot KESİNLİKLE uygulanmaz.
  if (interactionSnapshotSceneId === runtime.getActiveSceneId()) {
    boardAdapter.resumeInteraction(interactionSnapshot);
  }
  interactionSnapshot = null;
  interactionSnapshotSceneId = null;
  (topicsOpenerEl instanceof HTMLElement ? topicsOpenerEl : topicsOpenBtn).focus();
  topicsOpenerEl = null;
}
function onTopicsKeydown(evt) {
  if (evt.key === 'Escape') { evt.preventDefault(); closeTopicsList(); }
}
topicsOpenBtn.addEventListener('click', () => {
  if (!topicsPanel.hidden) { closeTopicsList(); return; }
  openTopicsList();
});

/* ── Bootstrap ──────────────────────────────────────────────────────
   ogren-3d.html'in "ilk TAMAMLANMAMIŞ dersi aç" yaklaşımıyla AYNI ruh:
   registry sırasında ilerleyip henüz completedSceneIds'te OLMAYAN ilk
   konuyu başlatır. Hepsi tamamlanmışsa (v0.10 — bkz. görev talimatı
   Bölüm A) teknik bir "final" ekranı YERİNE, kayıtlı SON konu replay
   modunda açılır — kullanıcı onu tekrar tamamlayıp kendi özet+[Konular]
   kontrolüne ulaşabilir veya topbar'daki "Konular" ile istediği konuya
   gidebilir. */
function boot() {
  if (!registry.size) { showErrorState(null, 'NO_SCENES'); return; }
  const progress = sceneProgressAdapter.load();
  const nextIncomplete = registry.list().find(scene => !progress.completedSceneIds.includes(scene.id));
  const target = nextIncomplete ?? registry.list()[registry.list().length - 1];
  const mode = nextIncomplete ? 'normal' : 'replay';

  const result = runtime.start(target.id, { mode });
  if (!result.ok) { showErrorState(target.id, result.reason); return; }
}

checkSceneRelease().then(outcome => {
  if (outcome === 'boot') boot();
  else if (outcome === 'stale-ui') showStaleReleaseUI();
  // 'redirecting' — navigasyon zaten başladı, burada hiçbir şey yapılmaz.
});
</script>
</body>
</html>
