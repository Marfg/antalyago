<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>(function(){var t="dark";try{var s=localStorage.getItem("antalyago-theme");if(s==="light"||s==="dark")t=s}catch(e){}document.documentElement.dataset.theme=t}())</script>
  <title>Robotla Oyna – AntalyaGo</title>
  <meta name="description" content="9×9 tahtada sabit güçlü robota karşı oyna. Dört taşla başla, kazandıkça taşların azalsın.">
  <link rel="icon" type="image/png" href="/assets/images/logo-rozet-96.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/design-system.css?v=2026-11-05.robot">
  <link rel="stylesheet" href="styles/theme-compat.css?v=2026-11-05.robot">
  <link rel="stylesheet" href="styles/robot-page.css?v=2026-11-05.robot">
</head>
<body class="page-shell app-shell-theme robot-page">
  <a class="skip-link" href="#rb-panel">Oyun denetimlerine geç</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-brand" href="index.html" aria-label="AntalyaGo ana sayfa">
        <img src="assets/images/logo-120.png" alt="" width="40" height="40">
        <span>AntalyaGo</span>
      </a>

      <button class="nav-toggle" data-nav-toggle type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menüyü aç">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
      </button>

      <nav class="site-nav" id="site-nav" data-site-nav aria-label="Ana navigasyon">
        <a href="learning-scenes.html">Öğren</a>
        <a href="robot.html" aria-current="page">Robotla Oyna</a>
        <a href="index.html#topluluk">Topluluk</a>
        <button class="theme-toggle" data-theme-toggle type="button" aria-pressed="false" aria-label="Gece temasına geç">Gece</button>
      </nav>
    </div>
  </header>

  <main class="rb-layout">
    <section class="rb-board" aria-label="9×9 Go tahtası">
      <canvas id="rb-canvas" role="img" aria-label="Oyun tahtası"></canvas>
    </section>

    <aside class="rb-panel" id="rb-panel">
      <p class="section-label rb-kicker" id="rb-level">Basamak 1 / 5</p>
      <h1 id="rb-title">Robotla oyna.</h1>
      <div class="rb-dots" id="rb-dots" aria-hidden="true"></div>
      <p class="rb-lead" id="rb-lead">Kazandıkça tahtadaki taşların azalır.</p>

      <p class="status-message rb-status" id="rb-status" role="status" aria-live="polite">Robot hazırlanıyor…</p>

      <div class="rb-estimate" id="rb-estimate" hidden>
        <div class="rb-estimate-bar" aria-hidden="true"><span id="rb-estimate-fill"></span></div>
        <p id="rb-estimate-text"></p>
      </div>

      <div class="rb-actions" id="rb-actions">
        <button class="button button-primary" id="rb-hint" type="button" aria-expanded="false" aria-controls="rb-tools">İpucu</button>
        <button class="button button-secondary" id="rb-pass" type="button">Pas</button>
      </div>

      <div class="rb-tools" id="rb-tools" hidden>
        <button class="rb-tool" type="button" data-tool="danger"><b>Tehlike</b><span>Atari var mı?</span></button>
        <button class="rb-tool" type="button" data-tool="region"><b>Bölge</b><span>Nereye bakmalı?</span></button>
        <button class="rb-tool" type="button" data-tool="move"><b>Hamle</b><span>Aday ve nedeni</span></button>
        <button class="rb-tool" type="button" data-tool="estimate" aria-pressed="false"><b>Tahmini alan</b><span>Kim önde?</span></button>
      </div>
      <p class="rb-hint-text" id="rb-hint-text" hidden></p>

      <div class="rb-result" id="rb-result" hidden>
        <button class="button button-primary" id="rb-confirm" type="button" hidden>Sayımı onayla</button>
        <button class="button button-primary" id="rb-next" type="button" hidden>Sonraki oyun</button>
        <a class="rb-quiet-link" id="rb-lessons" href="learning-scenes.html" hidden>Derslere dön</a>
      </div>

      <div class="rb-quiet" id="rb-quiet">
        <button class="rb-quiet-link" id="rb-resign" type="button">Teslim ol</button>
        <button class="rb-quiet-link" id="rb-new" type="button">Yeniden başla</button>
        <button class="rb-quiet-link" id="rb-reset" type="button" hidden>Basamakları sıfırla</button>
      </div>
    </aside>
  </main>

  <script type="module">
    import('./robot/robotPage.js?v=2026-11-05.robot').catch(error => {
      console.error(error);
      document.getElementById('rb-status').textContent = 'Robot açılamadı. Sayfayı yenileyip tekrar dene.';
      document.getElementById('rb-actions').hidden = true;
    });
  </script>
  <script type="module" src="core/theme.js?v=2026-11-05.robot"></script>
</body>
</html>
